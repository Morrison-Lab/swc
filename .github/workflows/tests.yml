# Offline checks: compile the scraper and build scripts, then build the site
# index from the committed seed data and syllabi.csv. No network calls.
name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Compile scripts
        run: python3 -m py_compile scraper/scrape.py scraper/build.py scraper/pages.py
      - name: Build the index from committed data
        run: python3 scraper/build.py
